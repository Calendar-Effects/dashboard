name: check that github.sfu.ca is reachable
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: HTTPS to the SFU GitHub API
        run: curl -sS -m 20 -o /dev/null -w "github.sfu.ca API: HTTP %{http_code}\n" https://github.sfu.ca/api/v3/meta || echo "github.sfu.ca API: unreachable"
      - name: Git over HTTPS (no token, so a private repo should ask for one)
        run: GIT_TERMINAL_PROMPT=0 timeout 30 git ls-remote https://github.sfu.ca/aba395/Calendar-Effects 2>&1 | head -3 || true